<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F0F11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Riot Inbox">
  <title>Riot Report Inbox</title>
  <style>
    :root {
      --bg: #0F0F11; --surface: #17171A; --raised: #1E1E22; --border: rgba(255,255,255,.08);
      --text: #EDEDEF; --text2: #A1A1AA; --text3: #6E6E78; --accent: #D6304F; --bad: #F87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px 32px;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 4px 0 16px; letter-spacing: -.01em; }
    h1 span { color: var(--text3); font-weight: 500; font-size: 14px; margin-left: 6px; }
    form { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    textarea {
      width: 100%; min-height: 84px; resize: vertical; background: var(--raised); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; outline: none;
    }
    textarea:focus { border-color: rgba(214,48,79,.6); }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .hint { color: var(--text3); font-size: 12px; flex: 1; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 9px 16px;
      font: 600 14px/1 inherit; font-family: inherit; cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .msg { margin: 10px 2px 0; font-size: 13px; min-height: 18px; color: var(--text2); }
    .msg.error { color: var(--bad); }
    .tabs { display: flex; gap: 6px; margin: 18px 0 4px; }
    .tabs button { background: var(--surface); color: var(--text2); border: 1px solid var(--border); font-weight: 500; padding: 7px 12px; }
    .tabs button.active { background: rgba(214,48,79,.15); color: var(--text); border-color: rgba(214,48,79,.45); }
    .tabs .n { color: var(--text3); margin-left: 4px; font-variant-numeric: tabular-nums; }
    h2 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text3); margin: 22px 2px 8px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    li.done { opacity: .62; }
    .status { font-size: 11px; color: var(--text3); white-space: nowrap; }
    li { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .top { display: flex; gap: 8px; align-items: baseline; }
    .title { font-weight: 600; font-size: 14px; flex: 1; overflow-wrap: anywhere; }
    .kind { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
    .kind.x_post { color: #60A5FA; background: rgba(96,165,250,.12); }
    .kind.article { color: #A78BFA; background: rgba(167,139,250,.12); }
    .kind.note { color: #FBBF24; background: rgba(251,191,36,.12); }
    .body { color: var(--text2); font-size: 13px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .meta { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--text3); }
    .meta a { color: var(--text2); text-decoration: none; }
    .meta button { background: none; padding: 0; font-size: 12px; font-weight: 500; }
    .meta .link { color: var(--text2); }
    .meta .del { margin-left: auto; color: var(--text3); }
    .empty { color: var(--text3); text-align: center; padding: 32px 0; margin: 0; }
  </style>
</head>
<body>
<main>
  <h1>Riot Report Inbox</h1>
  <form id="add">
    <textarea id="input" placeholder="Paste an X post or article link, or type a note…" autocapitalize="sentences"></textarea>
    <div class="row">
      <div class="hint">Links are fetched automatically. Anything else becomes a note.</div>
      <button type="submit" id="submit">Add</button>
    </div>
  </form>
  <div class="msg" id="msg"></div>
  <nav class="tabs">
    <button type="button" data-filter="all">All<span class="n"></span></button>
    <button type="button" data-filter="inbox">Queue<span class="n"></span></button>
    <button type="button" data-filter="used">Used<span class="n"></span></button>
  </nav>
  <div id="list"></div>
</main>
<script src="app.js"></script>
</body>
</html>
