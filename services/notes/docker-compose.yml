# Notes service on its own (a server, Raspberry Pi, or this Mac).
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#   open http://<this machine>:3030
# Data (inbox, news, rankings, settings) lives in ./data next to this file.
services:
  notes:
    build: .
    ports:
      - "3030:3000"
    volumes:
      - ./data:/app/data
    environment:
      # Set in .env next to this file (not committed). With no login or token, the service is open.
      NOTES_USER: ${NOTES_USER:-}          # browser login (the inbox page)
      NOTES_PASSWORD: ${NOTES_PASSWORD:-}
      NOTES_TOKEN: ${NOTES_TOKEN:-}        # Mac app and iPhone Shortcut
      FEED_INTERVAL_MINUTES: ${FEED_INTERVAL_MINUTES:-30}
      # Power rankings: TacticsFreeZone arrives by email, read from Gmail over IMAP.
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      TFZ_FORWARDED_FROM: ${TFZ_FORWARDED_FROM:-}   # older issues forwarded in from another inbox
      # Gemma through the Gemini API (Google AI Studio key). Not needed for a local Ollama model.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # First-run defaults for the weekly rankings sync; after that it's set in the app's Settings.
      # 16:00 UTC = 10 a.m. MDT / 9 a.m. MST, unaffected by daylight saving. "" turns it off.
      RANKINGS_SYNC_SCHEDULE: ${RANKINGS_SYNC_SCHEDULE-Tue 16:00}
      RANKINGS_SYNC_TZ: ${RANKINGS_SYNC_TZ:-UTC}
    # Lets the container reach Ollama on the host (needed on Linux; built in on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
