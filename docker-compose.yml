# Runs Newsdesk from the repo root, reading the repo-root .env.
# The service is defined in services/newsdesk/docker-compose.yml, which also works on its own
# (that's how it runs on a server or Raspberry Pi; see the README).
services:
  newsdesk:
    extends:
      file: services/newsdesk/docker-compose.yml
      service: newsdesk
